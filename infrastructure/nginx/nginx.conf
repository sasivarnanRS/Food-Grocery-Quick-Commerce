events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Upstream Cluster for Stateless Product Service (Horizontal Scaling Demo)
    upstream product_service_cluster {
        server product-service-1:4002 max_fails=3 fail_timeout=10s;
        server product-service-2:4012 max_fails=3 fail_timeout=10s;
        server product-service-3:4022 max_fails=3 fail_timeout=10s;
    }

    # API Gateway Reverse Proxy
    upstream api_gateway_cluster {
        server api-gateway:4000;
    }

    server {
        listen 80;
        server_name localhost;

        # Add tracking and proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Direct High-Throughput Load-Balanced Products Route
        location /api/v1/products {
            proxy_pass http://product_service_cluster;
            add_header X-LB-Served-By $upstream_addr always;
        }

        # Main API Gateway Router
        location / {
            proxy_pass http://api_gateway_cluster;
        }
    }
}
