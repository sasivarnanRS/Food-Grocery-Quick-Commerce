version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: quickcommerce_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: quickcommerce
    volumes:
      - mongo_data:/data/db
    networks:
      - qc_network
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: quickcommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qc_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: quickcommerce_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - qc_network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: quickcommerce_gateway
    ports:
      - "4000:4000"
    environment:
      PORT_GATEWAY: 4000
      PORT_USER_SERVICE: 4001
      PORT_PRODUCT_SERVICE: 4002
      PORT_INVENTORY_SERVICE: 4003
      PORT_CART_SERVICE: 4004
      PORT_ORDER_SERVICE: 4005
      PORT_DELIVERY_SERVICE: 4006
      PORT_NOTIFICATION_SERVICE: 4007
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    networks:
      - qc_network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: quickcommerce_user_svc
    ports:
      - "4001:4001"
    environment:
      PORT_USER_SERVICE: 4001
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
    depends_on:
      - mongodb
    networks:
      - qc_network

  # Horizontal Scaling: Multiple Product Service Instances
  product-service-1:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: quickcommerce_product_svc_1
    ports:
      - "4002:4002"
    environment:
      PORT_PRODUCT_SERVICE: 4002
      INSTANCE_ID: ProductService-4002
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - qc_network

  product-service-2:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: quickcommerce_product_svc_2
    ports:
      - "4012:4012"
    environment:
      PORT_PRODUCT_SERVICE: 4012
      INSTANCE_ID: ProductService-4012
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - qc_network

  product-service-3:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: quickcommerce_product_svc_3
    ports:
      - "4022:4022"
    environment:
      PORT_PRODUCT_SERVICE: 4022
      INSTANCE_ID: ProductService-4022
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - qc_network

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: quickcommerce_inventory_svc
    ports:
      - "4003:4003"
    environment:
      PORT_INVENTORY_SERVICE: 4003
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - qc_network

  cart-service:
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    container_name: quickcommerce_cart_svc
    ports:
      - "4004:4004"
    environment:
      PORT_CART_SERVICE: 4004
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
    depends_on:
      - mongodb
    networks:
      - qc_network

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: quickcommerce_order_svc
    ports:
      - "4005:4005"
    environment:
      PORT_ORDER_SERVICE: 4005
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - qc_network

  delivery-service:
    build:
      context: .
      dockerfile: services/delivery-service/Dockerfile
    container_name: quickcommerce_delivery_svc
    ports:
      - "4006:4006"
    environment:
      PORT_DELIVERY_SERVICE: 4006
      MONGODB_URI: mongodb://mongodb:27017/quickcommerce
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mongodb
      - rabbitmq
    networks:
      - qc_network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: quickcommerce_notification_svc
    ports:
      - "4007:4007"
    environment:
      PORT_NOTIFICATION_SERVICE: 4007
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - qc_network

  nginx-lb:
    image: nginx:alpine
    container_name: quickcommerce_nginx_lb
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - product-service-1
      - product-service-2
      - product-service-3
    networks:
      - qc_network

networks:
  qc_network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
